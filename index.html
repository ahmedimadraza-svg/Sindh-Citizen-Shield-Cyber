    <script>
      (function() {
        try {
          var _origFetch = window.fetch;
          var _currentFetch = _origFetch ? _origFetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(newFetch) {
              _currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (_) {}

        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && (
              event.message.indexOf('Cannot set property fetch') !== -1 ||
              event.message.indexOf('chrome-extension://') !== -1
            ))
          ) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event.reason &&
            typeof event.reason.message === 'string' &&
            (
              event.reason.message.indexOf('Cannot set property fetch') !== -1 ||
              (event.reason.stack && event.reason.stack.indexOf('chrome-extension://') !== -1)
            )
          ) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
        // Normalize repository URLs on GitHub Pages to enforce trailing slash so relative paths ./assets/ resolve correctly
        try {
          var pathname = window.location.pathname;
          if (pathname && pathname.length > 1 && !pathname.endsWith('/') && !pathname.includes('.')) {
            window.location.replace(window.location.origin + pathname + '/' + window.location.search + window.location.hash);
          }
        } catch (_) {}
      })();
    </script>
